x-security: &security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  user: "65532:65532"
  init: true
  pids_limit: 128
  tmpfs:
    - /data:rw,noexec,nosuid,size=16m
    - /tmp:rw,noexec,nosuid,size=64m

services:
  secure:
    <<: *security
    build:
      context: .
    environment:
      CLAIMJUMPER_DATABASE_URL: sqlite:////data/claimjumper.db
      CLAIMJUMPER_NOW: "2030-01-02T12:00:00Z"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - demo

  verify:
    <<: *security
    build:
      context: .
    command: ["./scripts/verify.sh"]
    network_mode: none
    profiles: ["tools"]

networks:
  demo:
    internal: true
