name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the complete local release gate
        run: ALLOW_VULNERABLE_DEMO=true docker compose --profile vulnerable run --rm --build integrated
