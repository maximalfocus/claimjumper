[project]
name = "claimjumper"
version = "0.1.0"
description = "Fictional local JWT verification teaching demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "pyjwt==2.10.1",
  "pydantic==2.11.7",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pyyaml==6.0.2",
  "ruff==0.12.8",
  "types-pyyaml==6.0.12.20241230",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimjumper"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/test_container_contract.py" = ["S108"]
"tests/test_vulnerable_api.py" = ["S603"]
"tests/test_recovery.py" = ["S108", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["claimjumper"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true
